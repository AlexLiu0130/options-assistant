name: options-assistant-proxy

services:
  web:
    container_name: options-assistant-web
    build:
      context: ..
      dockerfile: deploy/Dockerfile.nginx
    image: ${OPTIONS_ASSISTANT_WEB_IMAGE:-options-assistant-web:local}
    restart: unless-stopped
    ports:
      - "${WEB_HTTP_PORT:-80}:80"
    networks:
      - options-assistant-net

networks:
  options-assistant-net:
    external: true
