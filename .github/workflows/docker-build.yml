name: Docker Build

on:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: Branch, tag, or commit SHA to build
        required: true
        default: release/test
        type: string
      image_tag:
        description: Docker image tag. Use auto to derive one from the selected ref.
        required: true
        default: auto
        type: string
      push_images:
        description: Push images to GHCR
        required: true
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ inputs.push_images }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: meta
        shell: bash
        run: |
          repository="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          if [ "${{ inputs.image_tag }}" = "auto" ]; then
            tag="$(echo "${{ inputs.checkout_ref }}-${GITHUB_RUN_NUMBER}" | tr '/:@ ' '-' | tr -cd '[:alnum:]_.-')"
          else
            tag="$(echo "${{ inputs.image_tag }}" | tr '/:@ ' '-' | tr -cd '[:alnum:]_.-')"
          fi
          echo "app_image=ghcr.io/${repository}/options-assistant-app:${tag}" >> "$GITHUB_OUTPUT"

      - name: Build application service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.service
          push: ${{ inputs.push_images }}
          load: ${{ !inputs.push_images }}
          tags: ${{ steps.meta.outputs.app_image }}
          cache-from: type=gha,scope=options-assistant-app
          cache-to: type=gha,mode=max,scope=options-assistant-app

      - name: Print image tags
        run: |
          echo "Application service image: ${{ steps.meta.outputs.app_image }}"
