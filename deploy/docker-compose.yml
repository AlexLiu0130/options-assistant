name: options-assistant

services:
  app:
    container_name: options-assistant-app
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
    image: ${OPTIONS_ASSISTANT_APP_IMAGE:-options-assistant-app:local}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8787}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      PAPER_TRADE_STORE_PATH: ${PAPER_TRADE_STORE_PATH:-/data/paper-trades.json}
      SERVE_STATIC: ${SERVE_STATIC:-true}
      QVERIS_API_KEY: ${QVERIS_API_KEY:?set QVERIS_API_KEY}
      QVERIS_BASE_URL: ${QVERIS_BASE_URL:-https://qveris.ai/api/v1}
      QVERIS_SESSION_ID: ${QVERIS_SESSION_ID:-options-assistant-internal}
      QVERIS_REFRESH_MS: ${QVERIS_REFRESH_MS:-60000}
      QVERIS_QUOTE_REFRESH_MS: ${QVERIS_QUOTE_REFRESH_MS:-5000}
      QVERIS_MARKET_REFRESH_MS: ${QVERIS_MARKET_REFRESH_MS:-15000}
      QVERIS_OPTIONS_REFRESH_MS: ${QVERIS_OPTIONS_REFRESH_MS:-180000}
      QVERIS_OPEN_INTEREST_CACHE_MS: ${QVERIS_OPEN_INTEREST_CACHE_MS:-21600000}
      QVERIS_HEAVY_CONCURRENCY: ${QVERIS_HEAVY_CONCURRENCY:-4}
      QVERIS_PREWARM_ENABLED: ${QVERIS_PREWARM_ENABLED:-true}
      QVERIS_PREWARM_INTERVAL_MS: ${QVERIS_PREWARM_INTERVAL_MS:-15000}
      QVERIS_PREWARM_SYMBOLS: ${QVERIS_PREWARM_SYMBOLS:-TSLA,NVDA,AAPL,SPY,QQQ,IWM,MSFT,AMZN,META,AMD,NFLX,MU,SNDK,PLTR,MSTR,COIN}
      QVERIS_CLOSED_CACHE_MS: ${QVERIS_CLOSED_CACHE_MS:-21600000}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?set DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
    expose:
      - "8787"
    volumes:
      - paper-data:/data
      - qveris-cache:/app/.cache/qveris
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - options-assistant-net

volumes:
  paper-data:
  qveris-cache:

networks:
  options-assistant-net:
    name: options-assistant-net
