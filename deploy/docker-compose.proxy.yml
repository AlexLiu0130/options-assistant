name: options-assistant-proxy

services:
  nginx:
    container_name: options-assistant-nginx
    image: nginx:1.31.2-alpine
    restart: unless-stopped
    ports:
      - "${WEB_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - options-assistant-net

networks:
  options-assistant-net:
    external: true
